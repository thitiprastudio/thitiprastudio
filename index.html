<!-- Modal 7: ฟอร์มสั่งซื้อและเลือกสิทธิ์การใช้งานส่งเข้า LINE OA -->
<div id="orderLicenseModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center z-50 px-4">
    <div class="bg-white rounded-3xl p-6 w-full max-w-lg border-2 border-pink-300 shadow-2xl modal-enter relative max-h-[92vh] overflow-y-auto">
        <button onclick="closeModal('orderLicenseModal')" class="absolute top-4 right-4 text-gray-400 hover:text-pink-500 bg-gray-50 rounded-full p-1.5">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>

        <div class="text-center mb-4">
            <span class="text-xs bg-pink-100 text-pink-600 font-bold px-3 py-1 rounded-full">สั่งซื้อกับแอดมิน</span>
            <h3 class="font-slackey text-xl text-[#5c3a21] mt-2" id="orderModalFontTitle">ชื่อฟอนต์</h3>
            <p class="text-xs text-gray-400">กรุณาเลือกสิทธิ์การใช้งานและกรอกอีเมลเพื่อส่งออเดอร์ไปยัง LINE</p>
        </div>

        <form onsubmit="handleSendToLine(event)" class="space-y-4 text-xs">
            <!-- ตัวเลือกสิทธิ์ 3 แบบ -->
            <div class="space-y-2.5">
                <label class="block font-bold text-gray-700 text-sm">1. เลือกประเภทและสิทธิ์การใช้งาน</label>

                <!-- ตัวเลือก 1: ส่วนตัว -->
                <label class="block p-3.5 rounded-2xl border-2 cursor-pointer transition relative bg-pink-50/30 border-pink-200 hover:border-pink-400" id="label-personal">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <input type="radio" name="licenseSelect" value="personal" checked onchange="updateLicenseUI()" class="accent-pink-500">
                            <span class="font-bold text-gray-800 text-sm">ใช้งานส่วนตัว (Personal License)</span>
                        </div>
                        <span class="font-bold text-pink-600 text-sm" id="orderPricePersonal">฿79</span>
                    </div>
                    <div class="mt-2 text-gray-600 text-[11px] leading-relaxed border-t border-pink-100 pt-2 pl-6 space-y-0.5">
                        <p class="text-red-500 font-semibold">• ไม่เกี่ยวกับการเงิน รายได้ หรือผลกำไร</p>
                        <p>• สำหรับการศึกษาใช้จดสรุป ทำงานส่งอาจารย์ (ปริ้นอ่านเองได้)</p>
                        <p>• ตั้งฟอนต์เครื่อง Android ได้</p>
                        <p>• ใช้แต่งวิดีโอ/ภาพลงในพื้นที่ส่วนตัว (ที่ไม่ใช่พื้นที่ขายสินค้า/โปรโมท/รีวิว/เพจ)</p>
                    </div>
                </label>

                <!-- ตัวเลือก 2: เชิงพาณิชย์ -->
                <label class="block p-3.5 rounded-2xl border-2 cursor-pointer transition relative bg-yellow-50/40 border-yellow-200 hover:border-yellow-400" id="label-commercial">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <input type="radio" name="licenseSelect" value="commercial" onchange="updateLicenseUI()" class="accent-pink-500">
                            <span class="font-bold text-gray-800 text-sm">ใช้งานเชิงพาณิชย์ (Commercial)</span>
                        </div>
                        <span class="font-bold text-amber-700 text-sm" id="orderPriceCommercial">฿169</span>
                    </div>
                    <div class="mt-2 text-gray-600 text-[11px] leading-relaxed border-t border-yellow-100 pt-2 pl-6 space-y-0.5">
                        <p class="text-green-600 font-semibold">• มีเงิน รายได้ หรือผลกำไรเข้ามาเกี่ยวข้อง</p>
                        <p>• ออกแบบผลงาน แต่งป้าย ลงในพื้นที่ขายของ สำหรับบุคคลทั่วไป</p>
                        <p>• Sticker/Theme Line ต้องตกแต่งให้เรียบร้อยเท่านั้น</p>
                        <p>• สื่อออนไลน์: Instagram, Facebook, TikTok, Lemon8, เพจ, CapCut, YouTube</p>
                        <p>• สื่อสิ่งพิมพ์ ปริ้น ไดคัท สกรีน</p>
                        <p>• เช่น ออกแบบ Logo, Ads โฆษณา, แต่งภาพรีวิว, นายหน้า TikTok</p>
                    </div>
                </label>

                <!-- ตัวเลือก 3: นิติบุคคล / บริษัท -->
                <label class="block p-3.5 rounded-2xl border-2 cursor-pointer transition relative bg-purple-50/30 border-purple-200 hover:border-purple-400" id="label-business">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <input type="radio" name="licenseSelect" value="business" onchange="updateLicenseUI()" class="accent-pink-500">
                            <span class="font-bold text-gray-800 text-sm">นิติบุคคล (Business License)</span>
                        </div>
                        <span class="font-bold text-purple-700 text-sm">฿700</span>
                    </div>
                    <div class="mt-2 text-gray-600 text-[11px] leading-relaxed border-t border-purple-100 pt-2 pl-6 space-y-0.5">
                        <p class="text-purple-700 font-semibold">• สำหรับบริษัท องค์กร และ หจก. (เฉพาะเครือ BR&PRH เท่านั้น)</p>
                        <p>• จำกัดผู้ใช้งานไม่เกิน 5 เครื่อง ต่อ 1 การสั่งซื้อ</p>
                        <p>• ใช้งานเชิงพาณิชย์ภายในบริษัท หรือรับจ้างออกแบบให้ผู้อื่น</p>
                        <p>• ทางร้านออกใบเสร็จรับเงิน (ไม่จด VAT) + ใบรับรองสิทธิ์ (ฟรีแลนซ์ออกแบบให้บริษัท/ทำสื่อ/แพ็กเกจจิ้ง/โลโก้)</p>
                    </div>
                </label>
            </div>

            <!-- ช่องกรอกอีเมลลูกค้า -->
            <div class="space-y-1">
                <label class="block font-bold text-gray-700 text-sm">2. อีเมลของลูกค้า (Gmail สำหรับรับไฟล์ไดรฟ์)</label>
                <input required type="email" id="orderCustomerEmail" class="w-full border-2 border-pink-200 rounded-xl p-3 text-xs focus:outline-pink-400 bg-white" placeholder="example@gmail.com">
                <p class="text-[10px] text-gray-400">* ต้องใช้อีเมล Gmail เพื่อให้ระบบแชร์สิทธิ์โฟลเดอร์ Google Drive</p>
            </div>

            <!-- กล่องแจ้งเตือนระยะเวลา -->
            <div class="p-3 bg-amber-50 border border-amber-200 rounded-xl text-center text-amber-800 font-semibold text-xs">
                ⏰ ระบบจะเปิด LINE และส่งข้อมูลออเดอร์ให้แอดมิน<br>
                <span class="text-pink-600 font-bold">"รอแอดมินส่งบัญชีให้ภายใน 1 ชม. ค่ะ"</span>
            </div>

            <!-- ปุ่มส่งข้อมูล -->
            <button type="submit" class="w-full bg-[#06C755] hover:bg-[#05b34c] text-white font-bold py-3.5 rounded-2xl transition shadow-md flex items-center justify-center gap-2 text-sm">
                <i class="fab fa-line text-xl"></i> ยืนยันและส่งข้อมูลไปที่ LINE
            </button>
        </form>
    </div>
</div>
