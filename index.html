<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThitipraStudio - Official Font Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Slackey&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Mitr', sans-serif; background-color: #ffe4ef; color: #5c3a21; }
        .font-slackey { font-family: 'Slackey', cursive; }
        .clean-box { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 40px; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; padding: 1rem; }
        .font-card { background: white; border-radius: 24px; border: 2px solid #ffe4ef; overflow: hidden; cursor: pointer; transition: 0.25s all ease; box-shadow: 0 4px 15px rgba(255, 133, 179, 0.08); }
        .font-card:hover { border-color: #ff85b3; transform: translateY(-3px); }
        .preview-area { padding: 20px; text-align: center; font-size: 1.8rem; min-height: 80px; }
    </style>
</head>
<body class="min-h-screen pb-12 p-4">

    <!-- Top Bar -->
    <div class="max-w-4xl mx-auto flex justify-between items-center mb-6 bg-white/80 p-4 rounded-2xl shadow-sm">
        <h1 class="font-slackey text-2xl text-[#ff85b3]">ThitipraStudio</h1>
        <div class="flex gap-2 text-xs">
            <button onclick="openModal('customerPortalModal')" class="bg-purple-100 text-purple-700 font-bold px-4 py-2 rounded-xl">📁 คลังฟอนต์ของฉัน (เช็คไดรฟ์)</button>
            <button onclick="checkAdminStatus()" class="bg-pink-100 text-pink-600 font-bold px-4 py-2 rounded-xl"><i class="fas fa-lock"></i> แอดมิน</button>
        </div>
    </div>

    <!-- Main Catalog -->
    <main class="max-w-4xl mx-auto clean-box p-6 sm:p-10 shadow-2xl">
        <div class="mb-6">
            <input type="text" id="fontSearch" oninput="filterFonts()" placeholder="🔍 ค้นหาชื่อฟอนต์..." class="w-full bg-white border-2 border-pink-200 rounded-full py-3 px-6 text-sm focus:outline-none focus:border-pink-400 shadow-sm">
        </div>
        <div id="fontGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
    </main>

    <!-- Modal: สั่งซื้อและเลือกสิทธิ์ -->
    <div id="orderLicenseModal" class="modal">
        <div class="bg-white rounded-3xl p-6 w-full max-w-lg border-2 border-pink-300 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal('orderLicenseModal')" class="absolute top-4 right-4 text-gray-400 hover:text-pink-500"><i class="fas fa-times"></i></button>
            <h3 class="font-slackey text-xl text-[#5c3a21] text-center mb-2" id="orderModalFontTitle">ชื่อฟอนต์</h3>
            
            <form onsubmit="handleSubmitOrder(event)" class="space-y-4 text-xs mt-4">
                <div class="space-y-2">
                    <label class="block font-bold text-gray-700">เลือกสิทธิ์การใช้งาน (ลิงก์ไดรฟ์จะแยกตามสิทธิ์ที่ซื้อ)</label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="p-3 rounded-xl border-2 cursor-pointer bg-pink-50 border-pink-200 text-center">
                            <input type="radio" name="licenseSelect" value="personal" checked class="accent-pink-500 block mx-auto mb-1">
                            <span class="font-bold block">ใช้งานส่วนตัว</span>
                            <span class="text-pink-600 font-bold text-sm" id="orderPricePersonal">฿79</span>
                        </label>
                        <label class="p-3 rounded-xl border-2 cursor-pointer bg-yellow-50 border-yellow-200 text-center">
                            <input type="radio" name="licenseSelect" value="commercial" class="accent-pink-500 block mx-auto mb-1">
                            <span class="font-bold block">เชิงพาณิชย์</span>
                            <span class="text-amber-700 font-bold text-sm" id="orderPriceCommercial">฿169</span>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block font-bold text-gray-700 mb-1">Gmail สำหรับรับสิทธิ์เข้า Google Drive</label>
                    <input required type="email" id="orderCustomerEmail" class="w-full border-2 border-pink-200 rounded-xl p-3 bg-white" placeholder="yourname@gmail.com">
                </div>

                <div>
                    <label class="block font-bold text-gray-700 mb-1">แนบสลิปการโอนเงิน</label>
                    <input required type="file" id="orderSlipFile" accept="image/*" class="w-full border rounded-xl p-2 bg-white">
                </div>

                <button type="submit" id="btnSubmitOrder" class="w-full bg-[#ff85b3] text-white font-bold py-3.5 rounded-2xl shadow-md text-sm">
                    🚀 ยืนยันการสั่งซื้อและแจ้งชำระเงิน
                </button>
            </form>
        </div>
    </div>

    <!-- Modal: คลังฟอนต์ของฉัน (แยกไดรฟ์ส่วนตัว/พาณิชย์) -->
    <div id="customerPortalModal" class="modal">
        <div class="bg-white rounded-3xl p-6 w-full max-w-lg border-2 border-purple-300 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal('customerPortalModal')" class="absolute top-4 right-4 text-gray-400"><i class="fas fa-times"></i></button>
            <h3 class="font-slackey text-xl text-purple-900 text-center mb-1">คลังฟอนต์ของฉัน</h3>
            <p class="text-xs text-gray-500 text-center mb-4">กรอก Gmail เพื่อเข้าถึงลิงก์ Google Drive ตามสิทธิ์ที่ซื้อ</p>
            
            <form onsubmit="handleCustomerLogin(event)" class="space-y-3 mb-6 text-xs">
                <div class="flex gap-2">
                    <input required type="email" id="portalEmailInput" class="flex-1 border-2 border-purple-200 rounded-xl p-2.5 bg-white" placeholder="กรอก Gmail ที่ใช้สั่งซื้อ">
                    <button type="submit" class="bg-purple-600 text-white px-5 rounded-xl font-bold">ค้นหา</button>
                </div>
            </form>
            <div id="portalOrderList" class="space-y-2.5 text-xs">
                <div class="text-center text-gray-400 py-6">กรุณากรอกอีเมลเพื่อตรวจสอบสิทธิ์</div>
            </div>
        </div>
    </div>

    <!-- Modal: แอดมินจัดการฟอนต์ (แยกช่องใส่ไดรฟ์ส่วนตัว & พาณิชย์) -->
    <div id="adminDashboardModal" class="modal">
        <div class="bg-white rounded-3xl p-6 w-full max-w-3xl border-2 border-pink-300 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 class="font-bold text-pink-500 text-base">ระบบหลังบ้านแอดมิน (จัดการฟอนต์ & อนุมัติสลิป)</h3>
                <button onclick="closeModal('adminDashboardModal')" class="text-xs bg-gray-100 px-3 py-1.5 rounded-full">ปิด</button>
            </div>

            <!-- ฟอร์มเพิ่มฟอนต์ -->
            <form id="fontForm" onsubmit="handleSaveFont(event)" class="space-y-3 text-xs bg-pink-50/40 p-4 rounded-2xl border mb-6">
                <h4 class="font-bold text-gray-700 text-sm mb-2">+ เพิ่มฟอนต์ใหม่ (แยก Google Drive ตามสิทธิ์)</h4>
                <div class="grid grid-cols-2 gap-2">
                    <input required type="text" id="newFontTh" class="border p-2 rounded-xl bg-white" placeholder="ชื่อไทย">
                    <input required type="text" id="newFontEn" class="border p-2 rounded-xl bg-white" placeholder="ชื่ออังกฤษ (ห้ามเว้นวรรค)">
                </div>
                
                <!-- ช่องใส่ลิงก์ไดรฟ์แยกส่วนตัว / พาณิชย์ -->
                <div class="grid grid-cols-2 gap-2">
                    <div class="p-2.5 bg-pink-50 rounded-xl border border-pink-200">
                        <label class="block font-bold text-pink-700 mb-1">🔗 Google Drive (สิทธิ์ส่วนตัว)</label>
                        <input type="text" id="newFontDrivePersonal" class="w-full border rounded-lg p-1.5 bg-white text-[11px]" placeholder="ลิงก์ Drive สิทธิ์ส่วนตัว">
                    </div>
                    <div class="p-2.5 bg-yellow-50 rounded-xl border border-yellow-200">
                        <label class="block font-bold text-amber-800 mb-1">🔗 Google Drive (สิทธิ์พาณิชย์)</label>
                        <input type="text" id="newFontDriveCommercial" class="w-full border rounded-lg p-1.5 bg-white text-[11px]" placeholder="ลิงก์ Drive สิทธิ์พาณิชย์">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <input required type="text" id="newFontP" class="border p-2 rounded-xl bg-white" placeholder="ราคาส่วนตัว (เช่น 79.-)">
                    <input required type="text" id="newFontC" class="border p-2 rounded-xl bg-white" placeholder="ราคาพาณิชย์ (เช่น 169.-)">
                </div>
                <div>
                    <label class="block font-medium text-gray-600 mb-1">ไฟล์ฟอนต์ทดลองพิมพ์ (.ttf / .otf)</label>
                    <input required type="file" id="fileRegular" accept=".ttf,.otf" class="w-full text-[10px]">
                </div>
                <button type="submit" id="saveBtn" class="w-full bg-[#ff85b3] text-white font-bold py-2.5 rounded-xl">+ บันทึกฟอนต์ขึ้น Cloud</button>
            </form>

            <h4 class="font-bold text-gray-700 text-sm mb-2">รายการแจ้งโอนเงินรอตรวจสอบ</h4>
            <div id="adminOrdersContainer" class="space-y-2 max-h-60 overflow-y-auto"></div>
        </div>
    </div>

    <!-- Admin Login Modal -->
    <div id="adminLoginModal" class="modal">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm border-2 border-pink-300 shadow-2xl relative">
            <button onclick="closeModal('adminLoginModal')" class="absolute top-4 right-4 text-gray-400"><i class="fas fa-times"></i></button>
            <h3 class="font-slackey text-xl text-center text-[#ff85b3] mb-4">ADMIN ACCESS</h3>
            <form onsubmit="handleAdminLogin(event)" class="space-y-3 text-xs">
                <input required type="text" id="adminEmail" class="w-full border p-2.5 rounded-xl" placeholder="Username">
                <input required type="password" id="adminPass" class="w-full border p-2.5 rounded-xl" placeholder="Password">
                <button type="submit" class="w-full bg-[#ff85b3] text-white font-bold py-2.5 rounded-xl">เข้าสู่ระบบ</button>
            </form>
        </div>
    </div>

    <!-- Script Engine -->
    <script>
        const SUPABASE_URL = 'https://czyjemcsufzrvkcfzfwv.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_z10rntPACdi5LPL7lZe4yg_Ka2eCXPY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let fonts = [];
        let currentFont = null;
        let isAdminLoggedIn = false;

        async function init() {
            await loadFontsOnline();
            filterFonts();
        }

        async function loadFontsOnline() {
            const { data } = await supabaseClient.from('fonts').select('*').order('created_at', { ascending: false });
            if (data) fonts = data;
            for (const f of fonts) {
                if (f.file_regular) {
                    try {
                        const face = new FontFace(f.en, `url(${f.file_regular})`);
                        await face.load();
                        document.fonts.add(face);
                    } catch(e){}
                }
            }
        }

        function filterFonts() {
            const grid = document.getElementById('fontGrid');
            const search = (document.getElementById('fontSearch').value || '').toLowerCase().trim();
            grid.innerHTML = '';

            const filtered = fonts.filter(f => (f.th || '').toLowerCase().includes(search) || (f.en || '').toLowerCase().includes(search));
            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-gray-400 text-xs">ไม่พบฟอนต์ในระบบ</div>`;
                return;
            }

            filtered.forEach((f, i) => {
                const card = document.createElement('div');
                card.className = 'font-card p-4 flex flex-col justify-between';
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center text-xs mb-2" style="font-family:'${f.en}'">
                            <span class="font-bold">${i+1}. ${f.th} (${f.en})</span>
                            <span class="text-pink-500">ลองพิมพ์</span>
                        </div>
                        <div class="preview-area" style="font-family:'${f.en}'">สวัสดี hello</div>
                    </div>
                    <div class="pt-3 border-t flex justify-between items-center text-xs">
                        <span class="text-gray-500">ส่วนตัว: ${f.p} | พาณิชย์: ${f.c}</span>
                        <button class="bg-green-50 text-green-600 border border-green-200 px-3 py-1 rounded-full font-bold">สั่งซื้อ</button>
                    </div>
                `;
                card.onclick = () => openOrderModal(f);
                grid.appendChild(card);
            });
        }

        function openOrderModal(f) {
            currentFont = f;
            document.getElementById('orderModalFontTitle').innerText = `${f.th} (${f.en})`;
            document.getElementById('orderPricePersonal').innerText = `฿${f.p}`;
            document.getElementById('orderPriceCommercial').innerText = `฿${f.c}`;
            openModal('orderLicenseModal');
        }

        async function handleSubmitOrder(e) {
            e.preventDefault();
            if (!currentFont) return;
            const email = document.getElementById('orderCustomerEmail').value.trim();
            const slipFile = document.getElementById('orderSlipFile').files[0];
            const license = document.querySelector('input[name="licenseSelect"]:checked').value;
            const price = (license === 'personal') ? currentFont.p : currentFont.c;

            const btn = document.getElementById('btnSubmitOrder');
            btn.innerText = 'กำลังส่งข้อมูล...';
            btn.disabled = true;

            try {
                let slipUrl = '';
                if (slipFile) {
                    const ext = slipFile.name.split('.').pop();
                    const path = `slips/slip_${Date.now()}.${ext}`;
                    const { error } = await supabaseClient.storage.from('font-files').upload(path, slipFile);
                    if (!error) {
                        const { data } = supabaseClient.storage.from('font-files').getPublicUrl(path);
                        slipUrl = data.publicUrl;
                    }
                }

                await supabaseClient.from('orders').insert([{
                    font_id: currentFont.id,
                    font_name: `${currentFont.th} (${currentFont.en})`,
                    license_type: license,
                    price: price,
                    customer_email: email,
                    slip_url: slipUrl,
                    status: 'pending'
                }]);

                alert('แจ้งชำระเงินสำเร็จ! แอดมินจะตรวจสอบและเปิดสิทธิ์ Google Drive ให้ตามประเภทที่ซื้อ');
                closeModal('orderLicenseModal');
            } catch (err) {
                alert('เกิดข้อผิดพลาด: ' + err.message);
            } finally {
                btn.innerText = '🚀 ยืนยันการสั่งซื้อและแจ้งชำระเงิน';
                btn.disabled = false;
            }
        }

        async function handleCustomerLogin(e) {
            e.preventDefault();
            const email = document.getElementById('portalEmailInput').value.trim();
            const container = document.getElementById('portalOrderList');
            container.innerHTML = '<div class="text-center py-4 text-purple-600">กำลังค้นหาข้อมูล...</div>';

            const { data } = await supabaseClient.from('orders').select('*, fonts(drive_personal, drive_commercial)').eq('customer_email', email).order('created_at', { ascending: false });

            if (!data || data.length === 0) {
                container.innerHTML = `<div class="p-4 bg-red-50 text-red-600 rounded-xl text-center">ไม่พบประวัติการสั่งซื้อสำหรับอีเมลนี้</div>`;
                return;
            }

            container.innerHTML = '';
            data.forEach(order => {
                const isApproved = order.status === 'approved';
                // เลือกลิงก์ไดรฟ์ตามสิทธิ์ที่ลูกค้าซื้อจริง (ส่วนตัว หรือ พาณิชย์)
                let targetDriveUrl = '#';
                if (order.fonts) {
                    targetDriveUrl = (order.license_type === 'personal') ? (order.fonts.drive_personal || '#') : (order.fonts.drive_commercial || '#');
                }

                container.innerHTML += `
                    <div class="p-3.5 bg-purple-50/50 rounded-2xl border border-purple-100 flex justify-between items-center">
                        <div>
                            <div class="font-bold text-gray-800">${order.font_name}</div>
                            <div class="text-[10px] text-gray-500">สิทธิ์: <span class="font-bold text-pink-600">${order.license_type === 'personal' ? 'ส่วนตัว' : 'เชิงพาณิชย์'}</span> | สถานะ: ${isApproved ? '<span class="text-green-600 font-bold">อนุมัติแล้ว</span>' : '<span class="text-amber-600 font-bold">รอตรวจสอบสลิป</span>'}</div>
                        </div>
                        <div>
                            ${isApproved && targetDriveUrl !== '#' ? 
                                `<a href="${targetDriveUrl}" target="_blank" class="bg-[#06C755] text-white font-bold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1"><i class="fab fa-google-drive"></i> เปิดไดรฟ์</a>` : 
                                `<span class="text-[11px] text-gray-400">รอแอดมินเปิดสิทธิ์</span>`
                            }
                        </div>
                    </div>
                `;
            });
        }

        async function handleSaveFont(e) {
            e.preventDefault();
            const th = document.getElementById('newFontTh').value.trim();
            const en = document.getElementById('newFontEn').value.trim();
            const p = document.getElementById('newFontP').value.trim();
            const c = document.getElementById('newFontC').value.trim();
            const drive_personal = document.getElementById('newFontDrivePersonal').value.trim();
            const drive_commercial = document.getElementById('newFontDriveCommercial').value.trim();
            const file = document.getElementById('fileRegular').files[0];

            try {
                let file_regular = null;
                if (file) {
                    const ext = file.name.split('.').pop();
                    const path = `fonts/${en}_${Date.now()}.${ext}`;
                    const { error } = await supabaseClient.storage.from('font-files').upload(path, file);
                    if (!error) {
                        const { data } = supabaseClient.storage.from('font-files').getPublicUrl(path);
                        file_regular = data.publicUrl;
                    }
                }

                await supabaseClient.from('fonts').insert([{ th, en, p, c, drive_personal, drive_commercial, file_regular, order_index: fonts.length }]);
                alert('บันทึกฟอนต์สำเร็จ!');
                document.getElementById('fontForm').reset();
                await loadFontsOnline();
                filterFonts();
                loadAdminOrders();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        async function loadAdminOrders() {
            const container = document.getElementById('adminOrdersContainer');
            const { data } = await supabaseClient.from('orders').select('*').order('created_at', { ascending: false });
            if (!data) return;

            container.innerHTML = '';
            data.forEach(order => {
                const isPending = order.status === 'pending';
                container.innerHTML += `
                    <div class="p-3 rounded-2xl border ${isPending ? 'bg-amber-50 border-amber-200' : 'bg-gray-50'} flex justify-between items-center flex-wrap gap-2 text-xs">
                        <div>
                            <span class="font-bold">${order.font_name}</span> (${order.license_type === 'personal' ? 'ส่วนตัว' : 'เชิงพาณิชย์'}) - <b>${order.customer_email}</b>
                            ${order.slip_url ? `<br><a href="${order.slip_url}" target="_blank" class="text-pink-500 underline text-[10px]">ดูสลิป</a>` : ''}
                        </div>
                        <div>
                            ${isPending ? `<button onclick="approveOrder('${order.id}')" class="bg-[#06C755] text-white px-3 py-1.5 rounded-xl font-bold">✅ อนุมัติสิทธิ์</button>` : '<span class="text-green-600 font-bold">อนุมัติแล้ว</span>'}
                        </div>
                    </div>
                `;
            });
        }

        async function approveOrder(orderId) {
            if (!confirm('ยืนยันการอนุมัติออเดอร์นี้?')) return;
            await supabaseClient.from('orders').update({ status: 'approved' }).eq('id', orderId);
            alert('อนุมัติเรียบร้อย ระบบได้เปิดสิทธิ์ลิงก์ไดรฟ์ให้ลูกค้าอัตโนมัติ');
            loadAdminOrders();
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function checkAdminStatus() { if (isAdminLoggedIn) { loadAdminOrders(); openModal('adminDashboardModal'); } else openModal('adminLoginModal'); }
        function handleAdminLogin(e) {
            e.preventDefault();
            if (document.getElementById('adminEmail').value.trim() === 'brprh' && document.getElementById('adminPass').value.trim() === 'pleng235') {
                isAdminLoggedIn = true;
                closeModal('adminLoginModal');
                loadAdminOrders();
                openModal('adminDashboardModal');
            } else alert('รหัสผ่านไม่ถูกต้อง');
        }
        function adminLogout() { isAdminLoggedIn = false; closeModal('adminDashboardModal'); }

        init();
    </script>
</body>
</html>
