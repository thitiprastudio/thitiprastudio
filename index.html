<!-- Modal 6: Admin Dashboard (จัดการ/เพิ่ม/แก้ไข/เรียงลำดับฟอนต์) -->
<div id="adminDashboardModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center z-50 px-4">
    <div class="bg-white rounded-3xl p-6 w-full max-w-2xl border-2 border-pink-300 shadow-2xl modal-enter relative max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-center mb-4 border-b pb-3">
            <h3 class="font-slackey text-xl text-[#ff85b3]">ADMIN MANAGEMENT</h3>
            <button onclick="adminLogout()" class="text-xs bg-red-50 text-red-500 px-3 py-1 rounded-full hover:bg-red-100 transition">ออกจากระบบ</button>
        </div>

        <!-- ฟอร์มเพิ่ม/แก้ไขฟอนต์ -->
        <form id="fontForm" onsubmit="handleSaveFont(event)" class="space-y-3 text-xs bg-pink-50/40 p-4 rounded-2xl border border-pink-100 mb-6">
            <h4 id="formTitle" class="font-bold text-gray-700 text-sm mb-2 flex items-center gap-1.5">
                <i class="fas fa-plus-circle text-pink-400"></i> เพิ่มฟอนต์ใหม่
            </h4>
            <input type="hidden" id="editFontId" value="">

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block font-medium text-gray-700 mb-1">ชื่อภาษาไทย</label>
                    <input required type="text" id="newFontTh" class="w-full border border-pink-200 rounded-xl p-2.5 bg-white" placeholder="เช่น สเตฟานี่">
                </div>
                <div>
                    <label class="block font-medium text-gray-700 mb-1">ชื่อภาษาอังกฤษ (Family Name)</label>
                    <input required type="text" id="newFontEn" class="w-full border border-pink-200 rounded-xl p-2.5 bg-white" placeholder="เช่น Stephanie">
                </div>
            </div>

            <div>
                <label class="block font-medium text-gray-700 mb-1">รูปแบบราคา</label>
                <select id="priceType" onchange="togglePriceInputs()" class="w-full border border-pink-200 rounded-xl p-2.5 bg-white">
                    <option value="split">แยกราคา ส่วนตัว และ เชิงพาณิชย์</option>
                    <option value="single">ราคาเดียว (ใช้ได้ทั้งส่วนตัว & เชิงพาณิชย์)</option>
                </select>
            </div>

            <div id="splitPriceGroup" class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block font-medium text-gray-700 mb-1">ราคาส่วนตัว</label>
                    <input type="text" id="newFontP" class="w-full border border-pink-200 rounded-xl p-2.5 bg-white" placeholder="79.-">
                </div>
                <div>
                    <label class="block font-medium text-gray-700 mb-1">ราคาเชิงพาณิชย์</label>
                    <input type="text" id="newFontC" class="w-full border border-pink-200 rounded-xl p-2.5 bg-white" placeholder="169.-">
                </div>
            </div>

            <div id="singlePriceGroup" class="hidden">
                <label class="block font-medium text-gray-700 mb-1">ราคาเดียว (ใช้ได้ทั้ง 2 แบบ)</label>
                <input type="text" id="newFontSingle" class="w-full border border-pink-200 rounded-xl p-2.5 bg-white" placeholder="89.-">
            </div>

            <!-- อัปโหลดไฟล์แยกน้ำหนัก 3 ระดับ -->
            <div class="border-t border-pink-100 pt-3 space-y-2">
                <span class="block font-semibold text-gray-700">ไฟล์ฟอนต์ (.ttf / .otf)</span>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                    <div class="bg-white p-2 rounded-xl border border-pink-100">
                        <label class="block font-medium text-gray-600 mb-1">ปกติ (Regular) <span class="text-red-400">*</span></label>
                        <input type="file" id="fileRegular" accept=".ttf,.otf" class="w-full text-[10px]">
                    </div>
                    <div class="bg-white p-2 rounded-xl border border-pink-100">
                        <label class="block font-medium text-gray-600 mb-1">หนา (Bold)</label>
                        <input type="file" id="fileBold" accept=".ttf,.otf" class="w-full text-[10px]">
                    </div>
                    <div class="bg-white p-2 rounded-xl border border-pink-100">
                        <label class="block font-medium text-gray-600 mb-1">บาง (Light)</label>
                        <input type="file" id="fileLight" accept=".ttf,.otf" class="w-full text-[10px]">
                    </div>
                </div>
            </div>

            <div class="flex gap-2 pt-2">
                <button type="submit" id="saveBtn" class="flex-1 bg-[#ff85b3] hover:bg-pink-500 text-white font-bold py-2.5 rounded-xl transition">
                    + บันทึกฟอนต์
                </button>
                <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden px-4 bg-gray-200 text-gray-600 font-medium rounded-xl hover:bg-gray-300">
                    ยกเลิก
                </button>
            </div>
        </form>

        <!-- รายการจัดการและเรียงลำดับฟอนต์ -->
        <h4 class="font-bold text-gray-700 text-sm mb-3 flex items-center justify-between">
            <span>รายการฟอนต์ในระบบ (<span id="fontCountBadge">0</span>)</span>
            <span class="text-[11px] text-gray-400 font-normal">กดลูกศรเพื่อเรียงลำดับ</span>
        </h4>
        <div id="adminFontList" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
    </div>
</div>
<!-- ==================== JAVASCRIPT ==================== -->
<script>
    let fonts = [];
    let currentFont = null;
    let priceFilter = 'all';
    let currentWeight = 'normal';
    let isAdminLoggedIn = false;

    /* -------------------------------------------------------------
       1. ระบบจัดการฐานข้อมูลเบราว์เซอร์ (IndexedDB สำหรับเก็บไฟล์ฟอนต์)
    ------------------------------------------------------------- */
    const DB_NAME = 'ThitipraFontDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'font_files';

    function openDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);
            request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME);
                }
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }

    async function saveFontFile(key, arrayBuffer) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            tx.objectStore(STORE_NAME).put(arrayBuffer, key);
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
        });
    }

    async function getFontFile(key) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const req = tx.objectStore(STORE_NAME).get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }

    async function deleteFontFiles(fontId) {
        const db = await openDB();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.delete(`${fontId}_regular`);
        store.delete(`${fontId}_bold`);
        store.delete(`${fontId}_light`);
    }

    /* -------------------------------------------------------------
       2. การโหลดและบันทึกฟอนต์ (Font Loader & Lifecycle)
    ------------------------------------------------------------- */
    async function init() {
        loadFontsFromStorage();
        await loadAllFontFaceAssets();
        populateSelects();
        filterFonts();
    }

    function loadFontsFromStorage() {
        const saved = localStorage.getItem('thitipra_fonts_data');
        if (saved) {
            fonts = JSON.parse(saved);
        } else {
            fonts = [];
        }
    }

    function saveFontsToStorage() {
        localStorage.setItem('thitipra_fonts_data', JSON.stringify(fonts));
    }

    async function loadAllFontFaceAssets() {
        for (const f of fonts) {
            await registerFontFace(f.id, f.en, 'normal', `${f.id}_regular`);
            if (f.hasBold) await registerFontFace(f.id, f.en, 'bold', `${f.id}_bold`);
            if (f.hasLight) await registerFontFace(f.id, f.en, '300', `${f.id}_light`);
        }
    }

    async function registerFontFace(id, familyName, weight, storageKey) {
        try {
            const buffer = await getFontFile(storageKey);
            if (buffer) {
                const fontFace = new FontFace(familyName, buffer, { weight: weight });
                await fontFace.load();
                document.fonts.add(fontFace);
            }
        } catch (e) {
            console.error(`ไม่สามารถโหลดฟอนต์ ${familyName} (${weight}):`, e);
        }
    }

    function populateSelects() {
        const select = document.getElementById('singleFontSelect');
        const sL = document.getElementById('selectLeft');
        const sR = document.getElementById('selectRight');
        select.innerHTML = ""; sL.innerHTML = ""; sR.innerHTML = "";

        fonts.forEach((f) => {
            const opt = `<option value="${f.en}">${f.th} (${f.en})</option>`;
            select.innerHTML += opt;
            sL.innerHTML += opt;
            sR.innerHTML += opt;
        });

        if (sR.options.length > 1) sR.selectedIndex = 1;
    }

    /* -------------------------------------------------------------
       3. การแสดงผลหน้ารายการฟอนต์ & ตัวกรอง
    ------------------------------------------------------------- */
    function setPriceFilter(type) {
        priceFilter = type;
        document.querySelectorAll('.filter-btn, #btn-all, #btn-split, #btn-single').forEach(b => {
            b.classList.remove('bg-pink-400', 'text-white');
            b.classList.add('bg-white', 'text-pink-500');
        });
        const activeBtn = document.getElementById(`btn-${type}`);
        activeBtn.classList.add('bg-pink-400', 'text-white');
        activeBtn.classList.remove('bg-white', 'text-pink-500');
        filterFonts();
    }

    function filterFonts() {
        const term = document.getElementById('fontSearch').value.toLowerCase();
        const list = document.getElementById('fontList');
        list.innerHTML = "";

        const filtered = fonts.filter(f => {
            const match = f.th.toLowerCase().includes(term) || f.en.toLowerCase().includes(term);
            if (priceFilter === 'single') return match && (f.p === f.c);
            if (priceFilter === 'split') return match && (f.p !== f.c);
            return match;
        });

        if (filtered.length === 0) {
            list.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400 text-xs">ยังไม่มีรายการฟอนต์ในระบบ (แอดมินสามารถล็อกอินเพื่อเพิ่มได้)</div>`;
            return;
        }

        filtered.forEach((f, i) => {
            const card = document.createElement('div');
            card.className = 'font-card';
            const isSinglePrice = (f.p === f.c);
            const priceClass = isSinglePrice ? 'price-single-style' : 'price-split-style';
            const priceTxt = isSinglePrice ? `ใช้ได้ทั้ง 2 รูปแบบ: ${f.p}` : `ส่วนตัว: ${f.p} | เชิงพาณิชย์: ${f.c}`;

            card.innerHTML = `
                <div class="px-4 pt-3 font-semibold text-gray-800 text-sm flex justify-between items-center" style="font-family:'${f.en}'">
                    <span>${(i + 1).toString().padStart(2, '0')}. ${f.th} (${f.en})</span>
                    <span class="text-[10px] text-pink-400 font-sans"><i class="fas fa-hand-pointer"></i> ลองพิมพ์</span>
                </div>
                <div class="preview-area-card" style="font-family:'${f.en}'">สวัสดี hello</div>
                <div class="p-3 text-center text-xs ${priceClass} flex justify-between items-center">
                    <span class="font-medium">${priceTxt}</span>
                    <a href="https://lin.ee/8k1sAhb" target="_blank" class="bg-white border border-[#06C755] text-[#06C755] hover:bg-[#06C755] hover:text-white px-2.5 py-1 rounded-full text-[11px] transition">สั่งซื้อ</a>
                </div>
            `;
            card.onclick = (e) => { if (e.target.tagName !== 'A') openModal(f); };
            list.appendChild(card);
        });
    }

    /* -------------------------------------------------------------
       4. การทดสอบพิมพ์ (Modal เดี่ยว & VS Mode พร้อมเลือกน้ำหนักฟอนต์)
    ------------------------------------------------------------- */
    function openModal(f) {
        if (typeof f === 'string') {
            const modal = document.getElementById(f);
            modal.classList.remove('hidden');
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
            return;
        }
        currentFont = f;
        const modal = document.getElementById('fontModal');
        modal.classList.remove('hidden');
        modal.style.display = 'flex';
        document.getElementById('singleFontSelect').value = f.en;
        document.getElementById('modalFontName').innerText = `${f.th} (${f.en})`;
        document.getElementById('modalFontName').style.fontFamily = f.en;

        const modalPriceArea = document.getElementById('modalPriceDisplay');
        const isSinglePrice = (f.p === f.c);
        modalPriceArea.className = `p-3 text-xs font-semibold ${isSinglePrice ? 'price-single-style' : 'price-split-style'}`;
        modalPriceArea.innerText = isSinglePrice ? `ใช้ได้ทั้งส่วนตัว & เชิงพาณิชย์: ${f.p}` : `ส่วนตัว: ${f.p} | เชิงพาณิชย์: ${f.c}`;

        currentWeight = 'normal';
        refreshDisplay();
        document.body.style.overflow = 'hidden';
    }

    function setFontWeight(weight) {
        currentWeight = weight;
        refreshDisplay();
    }

    function changeSingleFont(fontEn) {
        const f = fonts.find(i => i.en === fontEn);
        if (f) openModal(f);
    }

    function refreshDisplay() {
        const txt = document.getElementById('testerInput').value || "ฐิติประสตูดิโอ ThitipraStudio";
        const size = document.getElementById('sizeSlider').value;
        const display = document.getElementById('testerDisplay');
        display.innerText = txt;
        display.style.fontFamily = currentFont ? currentFont.en : 'sans-serif';
        display.style.fontWeight = currentWeight;
        display.style.fontSize = size + "px";
        document.getElementById('sizeLabel').innerText = size + "px";
    }

    function openVS() {
        const modal = document.getElementById('vsModal');
        modal.classList.remove('hidden');
        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
        refreshVS();
    }

    function openVSFromModal() {
        const txt = document.getElementById('testerInput').value;
        closeModal('fontModal');
        openVS();
        if (currentFont) document.getElementById('selectLeft').value = currentFont.en;
        if (txt) document.getElementById('vsInput').value = txt;
        refreshVS();
    }

    function refreshVS() {
        const val = document.getElementById('vsInput').value || "สวัสดี hello";
        const size = document.getElementById('vsSizeSlider').value;
        const lF = document.getElementById('selectLeft').value;
        const rF = document.getElementById('selectRight').value;
        const dataL = fonts.find(f => f.en === lF);
        const dataR = fonts.find(f => f.en === rF);

        const dL = document.getElementById('displayLeft');
        const dR = document.getElementById('displayRight');
        dL.innerText = dR.innerText = val;
        dL.style.fontFamily = lF; dR.style.fontFamily = rF;
        dL.style.fontSize = dR.style.fontSize = size + "px";
        document.getElementById('vsSizeLabel').innerText = size + "px";

        const pL = document.getElementById('priceLeft');
        if (dataL) {
            const isSingleL = (dataL.p === dataL.c);
            pL.className = `p-2 text-center text-xs font-semibold ${isSingleL ? 'price-single-style' : 'price-split-style'}`;
            pL.innerText = isSingleL ? `ราคา: ${dataL.p}` : `ส่วนตัว: ${dataL.p} | เชิงพาณิชย์: ${dataL.c}`;
        }

        const pR = document.getElementById('priceRight');
        if (dataR) {
            const isSingleR = (dataR.p === dataR.c);
            pR.className = `p-2 text-center text-xs font-semibold ${isSingleR ? 'price-single-style' : 'price-split-style'}`;
            pR.innerText = isSingleR ? `ราคา: ${dataR.p}` : `ส่วนตัว: ${dataR.p} | เชิงพาณิชย์: ${dataR.c}`;
        }
    }

    function jumpToSingle(selectId) {
        const fontEn = document.getElementById(selectId).value;
        const fontData = fonts.find(f => f.en === fontEn);
        closeModal('vsModal');
        if (fontData) openModal(fontData);
    }

    function closeModal(id) {
        const modal = document.getElementById(id);
        modal.classList.add('hidden');
        modal.style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    function toggleMenu() {
        const menu = document.getElementById('side-menu');
        const overlay = document.getElementById('menu-overlay');
        if (menu.classList.contains('-translate-x-full')) {
            menu.classList.remove('-translate-x-full');
            overlay.classList.remove('hidden');
            setTimeout(() => overlay.classList.remove('opacity-0'), 10);
        } else {
            menu.classList.add('-translate-x-full');
            overlay.classList.add('opacity-0');
            setTimeout(() => overlay.classList.add('hidden'), 300);
        }
    }

    /* -------------------------------------------------------------
       5. ระบบแอดมิน (บันทึก / แก้ไข / ลบ / เรียงลำดับ)
    ------------------------------------------------------------- */
    function checkAdminStatus() {
        if (isAdminLoggedIn) {
            renderAdminFontList();
            openModal('adminDashboardModal');
        } else {
            openModal('adminLoginModal');
        }
    }

    function handleAdminLogin(e) {
        e.preventDefault();
        const email = document.getElementById('adminEmail').value.trim();
        const pass = document.getElementById('adminPass').value.trim();

        if (email === 'brprhfont@gmail.com' && pass === 'brprhthitiprastudio') {
            isAdminLoggedIn = true;
            closeModal('adminLoginModal');
            renderAdminFontList();
            openModal('adminDashboardModal');
        } else {
            alert('อีเมลหรือรหัสผ่านแอดมินไม่ถูกต้อง');
        }
    }

    function adminLogout() {
        isAdminLoggedIn = false;
        closeModal('adminDashboardModal');
    }

    function togglePriceInputs() {
        const type = document.getElementById('priceType').value;
        if (type === 'split') {
            document.getElementById('splitPriceGroup').classList.remove('hidden');
            document.getElementById('singlePriceGroup').classList.add('hidden');
        } else {
            document.getElementById('splitPriceGroup').classList.add('hidden');
            document.getElementById('singlePriceGroup').classList.remove('hidden');
        }
    }

    // ฟังก์ชันอ่านไฟล์เป็น ArrayBuffer
    function readFileAsArrayBuffer(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(reader.error);
            reader.readAsArrayBuffer(file);
        });
    }

    // บันทึกฟอนต์ (ทั้งเพิ่มใหม่ และ แก้ไข)
    async function handleSaveFont(e) {
        e.preventDefault();
        const editId = document.getElementById('editFontId').value;
        const th = document.getElementById('newFontTh').value.trim();
        const en = document.getElementById('newFontEn').value.trim();
        const priceType = document.getElementById('priceType').value;

        const regFile = document.getElementById('fileRegular').files[0];
        const boldFile = document.getElementById('fileBold').files[0];
        const lightFile = document.getElementById('fileLight').files[0];

        // ตรวจสอบความถูกต้อง
        if (!editId && !regFile) {
            alert('กรุณาเลือกไฟล์ฟอนต์ปกติ (Regular)');
            return;
        }

        let p, c;
        if (priceType === 'split') {
            p = document.getElementById('newFontP').value.trim() || '79.-';
            c = document.getElementById('newFontC').value.trim() || '169.-';
        } else {
            const single = document.getElementById('newFontSingle').value.trim() || '89.-';
            p = single; c = single;
        }

        const fontId = editId || `font_${Date.now()}`;

        // จัดการบันทึกไฟล์ฟอนต์ลง IndexedDB
        if (regFile) {
            const regBuffer = await readFileAsArrayBuffer(regFile);
            await saveFontFile(`${fontId}_regular`, regBuffer);
            await registerFontFace(fontId, en, 'normal', `${fontId}_regular`);
        }
        let hasBold = false;
        if (boldFile) {
            const boldBuffer = await readFileAsArrayBuffer(boldFile);
            await saveFontFile(`${fontId}_bold`, boldBuffer);
            await registerFontFace(fontId, en, 'bold', `${fontId}_bold`);
            hasBold = true;
        }
        let hasLight = false;
        if (lightFile) {
            const lightBuffer = await readFileAsArrayBuffer(lightFile);
            await saveFontFile(`${fontId}_light`, lightBuffer);
            await registerFontFace(fontId, en, '300', `${fontId}_light`);
            hasLight = true;
        }

        if (editId) {
            // โหมดแก้ไขข้อมูลเดิม
            const index = fonts.findIndex(f => f.id === editId);
            if (index !== -1) {
                fonts[index] = {
                    ...fonts[index],
                    th,
                    en,
                    p,
                    c,
                    hasBold: boldFile ? true : fonts[index].hasBold,
                    hasLight: lightFile ? true : fonts[index].hasLight
                };
            }
            alert('แก้ไขข้อมูลฟอนต์เรียบร้อยแล้ว');
        } else {
            // โหมดเพิ่มฟอนต์ใหม่
            fonts.push({
                id: fontId,
                th,
                en,
                p,
                c,
                hasBold,
                hasLight
            });
            alert('เพิ่มฟอนต์ใหม่เข้าสู่ระบบเรียบร้อยแล้ว');
        }

        saveFontsToStorage();
        resetForm();
        populateSelects();
        filterFonts();
        renderAdminFontList();
    }

    // แสดงรายการฟอนต์ในหน้าแอดมินเพื่อ จัดลำดับ / แก้ไข / ลบ
    function renderAdminFontList() {
        const container = document.getElementById('adminFontList');
        const badge = document.getElementById('fontCountBadge');
        container.innerHTML = '';
        badge.innerText = fonts.length;

        fonts.forEach((f, index) => {
            const row = document.createElement('div');
            row.className = 'flex items-center justify-between p-2.5 bg-gray-50 border border-gray-100 rounded-xl text-xs';
            row.innerHTML = `
                <div class="flex items-center gap-2">
                    <span class="font-bold text-gray-400 w-5">${index + 1}.</span>
                    <div>
                        <span class="font-bold text-gray-800">${f.th} (${f.en})</span>
                        <div class="text-[10px] text-gray-500">ส่วนตัว: ${f.p} | พาณิชย์: ${f.c}</div>
                    </div>
                </div>
                <div class="flex items-center gap-1">
                    <button onclick="moveFontOrder(${index}, -1)" ${index === 0 ? 'disabled' : ''} class="p-1 px-2 rounded bg-white border text-gray-600 hover:bg-gray-100 disabled:opacity-30">⬆</button>
                    <button onclick="moveFontOrder(${index}, 1)" ${index === fonts.length - 1 ? 'disabled' : ''} class="p-1 px-2 rounded bg-white border text-gray-600 hover:bg-gray-100 disabled:opacity-30">⬇</button>
                    <button onclick="startEditFont('${f.id}')" class="p-1 px-2 rounded bg-pink-100 text-pink-600 hover:bg-pink-200">แก้ไข</button>
                    <button onclick="deleteFont('${f.id}')" class="p-1 px-2 rounded bg-red-100 text-red-600 hover:bg-red-200">ลบ</button>
                </div>
            `;
            container.appendChild(row);
        });
    }

    // สลับลำดับฟอนต์ (ขึ้น/ลง)
    function moveFontOrder(index, direction) {
        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= fonts.length) return;
        const temp = fonts[index];
        fonts[index] = fonts[targetIndex];
        fonts[targetIndex] = temp;

        saveFontsToStorage();
        renderAdminFontList();
        populateSelects();
        filterFonts();
    }

    // เริ่มการแก้ไขฟอนต์
    function startEditFont(id) {
        const f = fonts.find(i => i.id === id);
        if (!f) return;

        document.getElementById('editFontId').value = f.id;
        document.getElementById('newFontTh').value = f.th;
        document.getElementById('newFontEn').value = f.en;

        if (f.p === f.c) {
            document.getElementById('priceType').value = 'single';
            document.getElementById('newFontSingle').value = f.p;
        } else {
            document.getElementById('priceType').value = 'split';
            document.getElementById('newFontP').value = f.p;
            document.getElementById('newFontC').value = f.c;
        }
        togglePriceInputs();

        document.getElementById('formTitle').innerHTML = '<i class="fas fa-edit text-pink-400"></i> แก้ไขข้อมูลฟอนต์';
        document.getElementById('saveBtn').innerText = 'บันทึกการแก้ไข';
        document.getElementById('cancelEditBtn').classList.remove('hidden');
    }

    // รีเซ็ตฟอร์ม
    function resetForm() {
        document.getElementById('fontForm').reset();
        document.getElementById('editFontId').value = '';
        document.getElementById('formTitle').innerHTML = '<i class="fas fa-plus-circle text-pink-400"></i> เพิ่มฟอนต์ใหม่';
        document.getElementById('saveBtn').innerText = '+ บันทึกฟอนต์';
        document.getElementById('cancelEditBtn').classList.add('hidden');
        togglePriceInputs();
    }

    // ลบฟอนต์
    async function deleteFont(id) {
        if (!confirm('ต้องการลบฟอนต์นี้ออกจากระบบหรือไม่?')) return;
        await deleteFontFiles(id);
        fonts = fonts.filter(f => f.id !== id);
        saveFontsToStorage();
        renderAdminFontList();
        populateSelects();
        filterFonts();
    }

    init();
</script>
